name: Run Node.js App from Docker Hub - one job

on:
  workflow_dispatch:
  push:
    branches: [ main ]    # Triggered automatically on push

jobs:
  run-container:
    runs-on: ubuntu-latest

    steps:
#      - name: Set up QEMU
#        uses: docker/login-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull image
        run: docker pull pingchili/cpsy-350-ci:latest

      - name: Run container
        run: |
          docker run -d --name my-node-app -p 3000:3000 pingchili/cpsy-350-ci:latest
          sleep 5 # wait for server to start
          curl http://localhost:3000
