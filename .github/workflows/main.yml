name: Build and Publish Node.js App

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  run-container:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull image
        run: docker pull pingchili/cpsy-350-ci:latest

      - name: Run container
        run: |
          docker run -d --name my-node-app -p 3000:3000 pingchili/cpsy-350-ci:latest
          sleep 5
          curl --fail http://localhost:3000 || (echo "App failed to respond" && exit 1)

  build-and-push:
    needs: run-container  # This ensures it runs only if run-container succeeds
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: pingchili/cpsy-350-ci:latest
